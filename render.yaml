# Render Blueprint — one Web Service serves API + built React app
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bonvoyage-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: bonvoyage
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: RAPIDAPI_HOST
        value: sky-scrapper.p.rapidapi.com
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CACHE_TTL_SECONDS
        value: "3600"
      # Set these in the Render Dashboard (sync: false = do not commit secrets)
      - key: GROQ_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: VITE_API_BASE_URL
        value: /api
